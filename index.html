<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my Valentine?</title>
<style>
body {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
height: 100vh;
font-family: 'Comic Sans MS', sans-serif;
background: #fff0f3; /* lighter pink F7BEBD*/
margin: 0;
}

#topImage {
width: 400px;
margin-bottom: 20px;
}

h1 {
font-size: 36px;
color: black;
margin-bottom: 30px;
text-align: center;
}

button {
padding: 15px 30px;
margin: 10px;
font-size: 20px;
cursor: pointer;
border: none;
border-radius: 10px;
box-shadow: 2px 2px 5px #888;
background-color: red;
color: white;
position: relative;
transition: all 0.3s ease;
}

#messageText {
display: none;
font-size: 30px;
color: #000000;
margin-top: 20px;
text-align: center;
}

#messageGif {
display: none;
margin-top: 20px;
width: 500px;
border-radius: 20px;
}
</style>
</head>
<body>

<img id="topImage" src="chick.jpeg" alt="Valentine Image">

<h1 id="question">Will you be my Valentine?</h1>

<div id="buttons">
<button id="yes">Yes</button>
<button id="no">No</button>
</div>

<!-- Message and GIF -->
<div id="messageText">Ofc you said yes, simp</div>
<img id="messageGif" src="yay.gif" alt="Celebration GIF">

<script>
const noBtn = document.getElementById('no');
const yesBtn = document.getElementById('yes');
const buttonsDiv = document.getElementById('buttons');
const question = document.getElementById('question');
const topImage = document.getElementById('topImage');
const messageText = document.getElementById('messageText');
const messageGif = document.getElementById('messageGif');

// Move "No" button randomly when hovered
noBtn.addEventListener('mouseenter', () => {
const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
noBtn.style.position = 'absolute';
noBtn.style.left = x + 'px';
noBtn.style.top = y + 'px';
});

// Show message and GIF instantly when "Yes" is clicked
yesBtn.addEventListener('click', () => {
// Hide question, buttons, and original image
question.style.display = 'none';
buttonsDiv.style.display = 'none';
topImage.style.display = 'none';

// Show message text and GIF instantly
messageText.style.display = 'block';
messageGif.style.display = 'block';
});
</script>

</body>
</html>
